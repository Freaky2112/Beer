<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9ece1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17201a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <title>Edit {{ b.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <header><h1>Edit beer</h1></header>
  <form method="post" class="add open" enctype="multipart/form-data">
    {% include "_form.html" %}
    <div class="row">
      <button class="primary">Save changes</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
