<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% include "_head.html" %}
  <title>Log in</title>
</head>
<body>
<main class="narrow">
  <div class="hero"><img src="{{ url_for('static', filename='can.webp') }}" alt="" width="197" height="210"></div>
  <header><h1>Log in</h1></header>
  <form method="post" class="add open">
    {% include "_flash.html" %}
    <div class="grid">
      <label class="wide">Username <input name="username" required autofocus autocomplete="username"></label>
      <label class="wide">Password <input type="password" name="password" required autocomplete="current-password"></label>
    </div>
    <div class="row">
      <button class="primary">Log in</button>
      <a href="{{ url_for('index') }}">Back to the list</a>
    </div>
  </form>
</main>
</body>
</html>
