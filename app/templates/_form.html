<div class="grid">
  <label>Beer
    <input name="name" required value="{{ b.name if b else '' }}" placeholder="Name of the beer">
  </label>
  <label>Brewery
    <input name="brewery" value="{{ b.brewery or '' if b else '' }}">
  </label>
  <label>Style
    <input name="style" value="{{ b.style or '' if b else '' }}" placeholder="IPA, stout, saison…">
  </label>
  <label>ABV %
    <input name="abv" inputmode="decimal" value="{{ b.abv or '' if b else '' }}" placeholder="5.5">
  </label>
  <label>IBU (bitterness)
    <input type="number" name="ibu" min="0" max="200" step="1" value="{{ b.ibu if b and b.ibu is not none else '' }}" placeholder="35">
  </label>
  <label>Serving temp °C
    <input name="serve_temp" inputmode="decimal" value="{{ ('%g' % b.serve_temp) if b and b.serve_temp is not none else '' }}" placeholder="6">
  </label>
  <label>Tasted on
    <input type="date" name="tasted_on" value="{{ b.tasted_on if b else today }}">
  </label>
  <label>Rating
    <select name="rating">
      {% for n in [5,4,3,2,1] %}
      <option value="{{ n }}" {{ 'selected' if (b.rating if b else 3) == n }}>{{ n }} / 5</option>
      {% endfor %}
    </select>
  </label>
  {% set sel = (b.tags if b and b.tags else []) %}
  <fieldset class="wide tagbox">
    <legend>Flavour tags</legend>
    <div class="chips">
      {% for t in PRESET_TAGS %}
      <label class="chip"><input type="checkbox" name="tags" value="{{ t }}" {{ 'checked' if t in sel }}><span>{{ t }}</span></label>
      {% endfor %}
      {% for t in sel if t not in PRESET_TAGS %}
      <label class="chip"><input type="checkbox" name="tags" value="{{ t }}" checked><span>{{ t }}</span></label>
      {% endfor %}
    </div>
    <input name="custom_tags" placeholder="Other tags, separated by commas (e.g. vanilla, oak)">
  </fieldset>
  <label class="wide">Photo
    {% if b and b.photo %}
    <span class="current">
      <img src="{{ url_for('photo', name=b.photo) }}" alt="" width="64" height="64">
      <span class="check"><input type="checkbox" name="remove_photo" value="1"> Remove this photo</span>
    </span>
    {% endif %}
    <input type="file" name="photo" accept="image/*">
  </label>
  <label class="wide">Review
    <textarea name="review" rows="3" placeholder="Aroma, taste, finish…">{{ b.review or '' if b else '' }}</textarea>
  </label>
</div>
