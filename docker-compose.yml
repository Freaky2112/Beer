services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: "1"
    volumes:
      - uploads:/data/uploads
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.beerlog.rule=Host(`${BEER_HOST}`)
      - traefik.http.routers.beerlog.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.beerlog.tls=true
      - traefik.http.routers.beerlog.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.services.beerlog.loadbalancer.server.port=5000
      # optional: reuse your existing IP allowlist middleware
      # - traefik.http.routers.beerlog.middlewares=lan-only@file
    depends_on:
      db:
        condition: service_healthy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  db_data:
  uploads:
